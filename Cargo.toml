[package]
name = "lightpool-oracle"
version = "0.8.0"
edition = "2021"
authors = ["LightPool Team"]
license = "MIT"
description = "Off-chain LightPool oracle: Hyperliquid mids, committee votes, leader ora_commit"
publish = false

[[bin]]
name = "lightpool-oracle"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.5.0", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.3", features = ["codec"] }
log = "0.4.14"
env_logger = "0.9.0"
clap = { version = "4.4.11", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.61"
anyhow = "1.0.38"
bincode = "1.3.3"
hex = "0.4.3"
reqwest = { version = "0.11", features = ["json"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
base64 = "0.13.0"
axum = "0.7"
url = "2"

lightpool-crypto = { path = "../lightpool-crypto" }
lightpool-types = { path = "../lightpool/crates/lightpool-types" }

[patch."https://github.com/xiaoyu1998/lightpool-crypto.git"]
lightpool-crypto = { path = "../lightpool-crypto" }
